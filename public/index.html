<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>치지직 !(제목) 리스트</title>
<style>
  html, body { background: transparent; }
  body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 700px; margin: 40px auto; color:#fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
  h1 { font-size: 20px; }
  #login { padding: 10px 16px; background:#03cf5d; color:#111; border-radius:6px; font-weight:bold; text-decoration:none; display:inline-block; text-shadow:none; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.3); text-align: left; }
  th { color: #ddd; font-size: 13px; }
  .time { color: #ccc; font-size: 12px; }
</style>
</head>
<body>
  <div id="loginArea"></div>
  <table id="tbl" style="display:none;">
    <tbody id="tbody"></tbody>
  </table>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function refresh() {
  const res = await fetch('/api/list');
  const data = await res.json();
  const area = document.getElementById('loginArea');
  const tbl = document.getElementById('tbl');
  const tbody = document.getElementById('tbody');

  if (!data.loggedIn) {
    area.innerHTML = '<a id="login" href="/auth/login">치지직 계정으로 로그인하기</a>';
    tbl.style.display = 'none';
    return;
  }
  area.innerHTML = '';

  tbl.style.display = data.list.length ? 'table' : 'none';
  tbody.innerHTML = data.list
    .map(
      (e) =>
        `<tr><td>${escapeHtml(e.nickname)}</td><td>${escapeHtml(e.title)}</td></tr>`
    )
    .join('');
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
